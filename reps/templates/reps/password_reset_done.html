{% extends 'reps/base_reps.html' %}
{% block title %} Reset Password {% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-envelope-paper-fill" style="font-size: 3rem; color: #fe5d26;"></i>
            <h3 class="h3 mt-3 mb-2">Check your email</h3>
            <p class="fs-6">If an account exists with that email, we've sent a link to reset your password.</p>
            <p class="mt-4"><a href="{% url 'reps:login' %}">Back to login</a></p>
        </div>
    </div>
</div>
{% endblock %}
