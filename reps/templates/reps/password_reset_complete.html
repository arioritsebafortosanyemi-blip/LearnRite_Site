{% extends 'reps/base_reps.html' %}
{% block title %} Password Changed {% endblock %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <i class="bi bi-check-circle-fill" style="font-size: 3rem; color: #59cd90;"></i>
            <h3 class="h3 mt-3 mb-2">Password Changed</h3>
            <p class="fs-6">Your password has been updated. You can now log in with your new password.</p>
            <a class="btn btn-dark px-4 py-2 mt-3" href="{% url 'reps:login' %}">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
